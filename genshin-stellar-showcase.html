<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原神·千星奇域 服装展示</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --gold: #f4d03f;
            --purple: #9b59b6;
            --silver: #bdc3c7;
            --bronze: #cd6133;
            --text: #ecf0f1;
            --text-muted: #95a5a6;
            --card-bg: #0f0f23;
            --card-border: rgba(233, 69, 96, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(rgba(10,10,26,0.7), rgba(10,10,26,0.85)), url('images/header-bg.png') center/cover no-repeat fixed;
            min-height: 100vh;
            color: var(--text);
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 20px;
            background: linear-gradient(rgba(10,10,26,0.5), rgba(10,10,26,0.7)), url('images/header-bg.png') center/cover no-repeat;
            position: relative;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .bg-cover {
            background: var(--primary);
            position: relative;
            z-index: 1;
            padding-top: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(244, 208, 63, 0.3);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        /* Search Section */
        .search-section {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
            padding: 15px 20px;
            border: 2px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            background: rgba(15, 15, 35, 0.8);
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .filter-select {
            padding: 15px 20px;
            border: 2px solid rgba(233, 69, 96, 0.4);
            border-radius: 12px;
            background: rgba(15, 15, 35, 0.8);
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            min-width: 150px;
        }

        .filter-select option {
            background: var(--card-bg);
            color: var(--text);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* Group Section */
        .group-section {
            margin-bottom: 40px;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px 25px;
            background: linear-gradient(90deg, rgba(233, 69, 96, 0.15) 0%, transparent 100%);
            border-left: 4px solid var(--accent);
            border-radius: 0 12px 12px 0;
        }

        .group-title {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold) 0%, #fff 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .group-count {
            font-size: 0.9em;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* Outfit Grid - Single flat grid */
        .outfit-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Version Row */
        .version-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .version-row .outfit-card {
            flex: 0 0 calc(25% - 15px);
            max-width: calc(25% - 15px);
        }

        @media (max-width: 1200px) {
            .version-row .outfit-card { flex: 0 0 calc(33.333% - 14px); max-width: calc(33.333% - 14px); }
        }
        @media (max-width: 900px) {
            .version-row .outfit-card { flex: 0 0 calc(50% - 10px); max-width: calc(50% - 10px); }
        }
        @media (max-width: 600px) {
            .version-row { flex-direction: column; }
            .version-row .outfit-card { flex: 0 0 100%; max-width: 100%; }
        }

        /* Card */
        .outfit-card {
            background: linear-gradient(145deg, var(--card-bg) 0%, rgba(22, 33, 62, 0.5) 100%);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .outfit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.2);
            border-color: var(--accent);
            cursor: pointer;
        }

        .card-image {
            aspect-ratio: 3 / 4;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.2) 0%, rgba(155, 89, 182, 0.2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .outfit-card.has-image2 .card-images {
            display: flex;
            gap: 2px;
            width: 100%;
            height: 100%;
        }

        .outfit-card.has-image2 .card-images img {
            flex: 1;
            width: 50%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .version-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.75em;
            background: rgba(0, 0, 0, 0.6);
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        .rarity-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .rarity-legendary {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            color: #fff;
            box-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
        }

        .rarity-outstanding {
            background: linear-gradient(135deg, var(--purple), #8e44ad);
            color: #fff;
            box-shadow: 0 0 15px rgba(155, 89, 182, 0.5);
        }

        .rarity-superior {
            background: linear-gradient(135deg, var(--gold), #f1c40f);
            color: #1a1a2e;
            box-shadow: 0 0 15px rgba(244, 208, 63, 0.5);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.4em;
            margin-bottom: 8px;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .card-rarity {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            padding-left: 4px;
        }

        .card-rarity .stars {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 4px rgba(255, 255, 255, 0.5);
        }

        .rarity-legendary.card-rarity { color: rgba(255, 200, 150, 0.95); }
        .rarity-outstanding.card-rarity { color: rgba(200, 180, 255, 0.95); }
        .rarity-superior.card-rarity { color: rgba(255, 230, 150, 0.95); }

        .card-desc {
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 15px;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: calc(1.6em * 3);
        }

        .card-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 0 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: auto;
        }

        .price {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--gold);
        }

        .price.free {
            color: #2ecc71;
        }

        .obtain-method {
            font-size: 0.85em;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 6px;
            margin-left: auto;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9em;
            border-top: 1px solid rgba(233, 69, 96, 0.2);
            margin-top: 40px;
        }

        /* Highlight Animation */
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(244, 208, 63, 0.3); }
            50% { box-shadow: 0 0 20px rgba(244, 208, 63, 0.6); }
        }

        .match-highlight {
            animation: glow 1s ease-in-out;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(145deg, var(--card-bg) 0%, rgba(22, 33, 62, 0.8) 100%);
            border: 2px solid var(--accent);
            border-radius: 20px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            animation: modalIn 0.3s ease;
            display: flex;
        }

        /* 3列Modal布局 */
        .modal-3col {
            display: flex;
            width: 100%;
            max-height: 85vh;
        }
        .modal-col-left {
            flex: 0 0 38%;
            max-height: 85vh;
            overflow-y: auto;
            border-right: 1px solid rgba(233, 69, 96, 0.2);
        }
        .modal-col-center {
            flex: 1;
            max-height: 85vh;
            overflow-y: auto;
            padding: 25px 20px;
        }
        .modal-col-right {
            flex: 0 0 32%;
            max-height: 85vh;
            overflow-y: auto;
            border-left: 1px solid rgba(233, 69, 96, 0.2);
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(233, 69, 96, 0.3);
            color: var(--text);
            font-size: 1.5em;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .modal-col-left .modal-image {
            width: 100%;
            height: 100%;
            min-height: 300px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            cursor: zoom-in;
        }

        .modal-col-left .modal-image:hover .modal-zoom-hint {
            opacity: 1;
        }

        .modal-col-left .modal-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        .modal-image-placeholder {
            font-size: 6em;
            color: rgba(244, 208, 63, 0.4);
        }

        .modal-zoom-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 15px;
            opacity: 0.7;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .modal-rarity-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
        }

        .modal-version-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
        }

        /* 中间列 - 信息区 */
        .modal-col-center .modal-title {
            font-size: 1.4em;
            margin-bottom: 4px;
            color: var(--text);
        }

        .modal-col-center .modal-stars {
            font-size: 1.1em;
            margin-bottom: 15px;
            color: var(--gold);
        }

        .modal-col-center .modal-section {
            margin-bottom: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
        }

        .modal-col-center .modal-section-title {
            font-size: 0.8em;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .modal-col-center .modal-section-content {
            font-size: 0.9em;
            color: var(--text);
            line-height: 1.6;
            white-space: pre-line;
        }

        .modal-col-center .modal-price-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: linear-gradient(135deg, rgba(244, 208, 63, 0.1) 0%, rgba(233, 69, 96, 0.1) 100%);
            border-radius: 12px;
            border: 1px solid rgba(244, 208, 63, 0.3);
        }

        .modal-col-center .modal-price-label {
            font-size: 0.8em;
            color: var(--text-muted);
        }

        .modal-col-center .modal-price-value {
            font-size: 1.4em;
            font-weight: bold;
            color: var(--gold);
        }

        .modal-col-center .modal-price-value.free {
            color: #2ecc71;
        }

        .modal-obtain-box {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .modal-obtain-item {
            flex: 1;
            padding: 15px;
            background: rgba(155, 89, 182, 0.1);
            border-radius: 10px;
            text-align: center;
        }

        .modal-obtain-label {
            font-size: 0.8em;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .modal-obtain-value {
            font-size: 1em;
            color: var(--text);
        }

        /* 右侧评论区 */
        .comment-section {
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .comment-header {
            font-size: 1.1em;
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .comment-header::before {
            content: '💬';
        }
        .comment-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .comment-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 8px;
            background: rgba(15, 15, 35, 0.6);
            color: var(--text);
            font-size: 0.9em;
            resize: none;
            min-height: 60px;
            font-family: inherit;
        }
        .comment-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .comment-input::placeholder {
            color: var(--text-muted);
        }
        .comment-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .comment-upload-btn {
            padding: 8px 14px;
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 8px;
            background: rgba(15, 15, 35, 0.6);
            color: var(--text-muted);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .comment-upload-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: rgba(233, 69, 96, 0.1);
        }
        .comment-upload-btn img {
            width: 14px;
            height: 14px;
        }
        .comment-submit-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: #fff;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .comment-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        .comment-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .comment-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
        }
        .comment-user {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            color: #fff;
            font-weight: bold;
        }
        .comment-nickname {
            font-size: 0.85em;
            color: var(--gold);
            font-weight: 600;
        }
        .comment-time {
            font-size: 0.75em;
            color: var(--text-muted);
            margin-left: auto;
        }
        .comment-delete-btn {
            margin-left: 8px;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: rgba(233, 69, 96, 0.3);
            color: var(--text-muted);
            font-size: 0.7em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0;
        }
        .comment-item:hover .comment-delete-btn {
            opacity: 1;
        }
        .comment-delete-btn:hover {
            background: var(--accent);
            color: #fff;
        }
        .comment-text {
            font-size: 0.9em;
            color: var(--text);
            line-height: 1.5;
            word-break: break-word;
        }
        .comment-images {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .comment-images img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .comment-images img:hover {
            transform: scale(1.05);
        }
        .comment-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9em;
            padding: 20px 0;
        }

        /* Preview image in comment input */
        .comment-preview-images {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .comment-preview-item {
            position: relative;
        }
        .comment-preview-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
        }
        .comment-preview-images .remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 0.7em;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .comment-preview-item {
            position: relative;
        }

        .header .user-id-badge {
            position: absolute;
            top: 15px;
            right: 20px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(233,69,96,0.25);
            border: 1px solid rgba(233,69,96,0.4);
            color: var(--gold);
            font-size: 0.85em;
            font-weight: 600;
        }

        /* 注册弹窗 */
        .welcome-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .welcome-box {
            background: linear-gradient(145deg, var(--card-bg), rgba(22,33,62,0.9));
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 40px;

                header.style.cssText = 'display: flex; align-items: center; gap: 15px; margin: 30px 0 20px; padding: 12px 20px; background: linear-gradient(90deg, rgba(233,69,96,0.15) 0%, transparent 100%); border-left: 4px solid #e94560; border-radius: 0 10px 10px 0;';
                header.innerHTML = `
                    <h2 class="group-title" style="font-size: 1.5em; font-weight: bold; background: linear-gradient(135deg, #f4d03f 0%, #fff 50%, #f4d03f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;">✧ ${version}</h2>
                    <span class="group-count" style="font-size: 0.85em; color: #95a5a6; background: rgba(255,255,255,0.05); padding: 3px 10px; border-radius: 15px;">${versionOutfits.length} 套</span>
                `;
                outfitGrid.appendChild(header);

                // Version row with cards
                const row = document.createElement('div');
                row.className = 'version-row';
                
                versionOutfits.forEach((outfit, index) => {
                    // 有nameAlt的表示有男女款，拆成两个卡片
                    if (outfit.nameAlt) {
                        const names = outfit.nameAlt.split(' / ');
                        const card1 = createOutfitCard(outfit, index, outfit.image, names[0], '女');
                        row.appendChild(card1);
                        if (outfit.image2) {
                            const card2 = createOutfitCard(outfit, index + 0.5, outfit.image2, names[1], '男');
                            row.appendChild(card2);
                        }
                    } else {
                        const card = createOutfitCard(outfit, index);
                        row.appendChild(card);
                    }
                });
                
                outfitGrid.appendChild(row);
            });
        }

        function createOutfitCard(outfit, index, image, name, label) {
            const displayImage = image || outfit.image;
            // label存在时表示男女卡片，name已经是完整名称（从nameAlt拆分而来），不要再追加label
            const displayName = name || outfit.name;
            
            // 根据label选择对应的描述
            let displayDesc = outfit.desc;
            if (label === '女' && outfit.descLabel女) {
                displayDesc = outfit.descLabel女;
            } else if (label === '男' && outfit.descLabel男) {
                displayDesc = outfit.descLabel男;
            }
            
            const card = document.createElement('div');
            card.className = 'outfit-card';
            card.style.animationDelay = `${index * 0.1}s`;

            const rarityClass = `rarity-${outfit.rarity}`;
            const priceDisplay = outfit.isFree ?
                `<span class="price free">${outfit.price}</span>` :
                `<span class="price">${outfit.price}</span>`;

            const imageContent = displayImage ?
                `<img src="${displayImage}" alt="${displayName}" loading="lazy">` :
                '<span style="font-size: 3em; color: rgba(244,208,63,0.3);">✧</span>';

            card.innerHTML = `
                <div class="card-image">
                    ${imageContent}
                    <span class="version-badge">${outfit.version}</span>
                    <span class="rarity-badge ${rarityClass}">${outfit.rarityLabel}</span>
                </div>
                <div class="card-content">
                    <h3 class="card-title">${displayName}</h3>
                    <div class="card-rarity ${rarityClass}">
                        <span class="stars">${'★'.repeat(outfit.stars)}</span>
                    </div>
                    <p class="card-desc">${displayDesc}</p>
                    <div class="card-footer">
                        ${priceDisplay}
                        <span class="obtain-method">${outfit.obtain}</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => openModal(outfit, displayImage, label));
            return card;
        }

        // Filter Logic
        let currentVersion = '月之七';

        function filterOutfits() {
            const keyword = searchInput.value.toLowerCase().trim();
            const rarityValue = rarityFilter.value;
            const priceValue = priceFilter.value;

            const filtered = outfits.filter(outfit => {
                const hasKeyword = !!keyword;
                const versionMatch = hasKeyword || currentVersion === 'all' || outfit.version === currentVersion;

                const keywordMatch = !keyword ||
                    outfit.name.toLowerCase().includes(keyword) ||
                    outfit.nameAlt?.toLowerCase().includes(keyword) ||
                    outfit.desc.toLowerCase().includes(keyword) ||
                    outfit.obtain.toLowerCase().includes(keyword) ||
                    outfit.keywords.some(k => k.toLowerCase().includes(keyword));

                const rarityMatch = rarityValue === 'all' || outfit.rarity === rarityValue;

                const priceMatch = priceValue === 'all' ||
                    (priceValue === 'free' && outfit.price === '免费' && outfit.isFree) ||
                    (priceValue === 'pass' && outfit.price === '通行证获取') ||
                    (priceValue === 'selfpick' && outfit.price === '活动自选') ||
                    (priceValue === 'paid' && outfit.price === '事象凝核');

                return versionMatch && keywordMatch && rarityMatch && priceMatch;
            });

            renderOutfits(filtered);
            updateStats(filtered);
        }

        // Update Stats
        function updateStats(data) {
            totalCount.textContent = data.length;
            freeCount.textContent = data.filter(o => o.price === '免费').length;
            passCount.textContent = data.filter(o => o.price === '通行证获取').length;
            selfpickCount.textContent = data.filter(o => o.price === '活动自选').length;
            paidCount.textContent = data.filter(o => o.price === '事象凝核').length;
        }

        // Event Listeners
        searchInput.addEventListener('input', filterOutfits);
        rarityFilter.addEventListener('change', filterOutfits);
        priceFilter.addEventListener('change', filterOutfits);

        // Version Tab Click
        const versionTabs = document.getElementById('versionTabs');
        versionTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.version-tab');
            if (!tab) return;
            currentVersion = tab.dataset.version;
            document.querySelectorAll('.version-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            filterOutfits();
        });

        // Initial Render - only 月之七
        filterOutfits();

        // Modal Functions
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        let currentOutfitId = null;
        let pendingCommentImages = [];

        // 初始化评论区事件
        document.getElementById('commentImageInput').addEventListener('change', handleCommentImageUpload);
        document.getElementById('commentSubmitBtn').addEventListener('click', submitComment);

        function handleCommentImageUpload(e) {
            const files = Array.from(e.target.files);
            const previewContainer = document.getElementById('commentPreviewImages');
            const MAX_SIZE = 2 * 1024 * 1024; // 2MB

            files.forEach(file => {
                if (file.size > MAX_SIZE) {
                    alert(`图片 "${file.name}" 大小超过2MB限制，请选择更小的图片`);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    pendingCommentImages.push(dataUrl);
                    const div = document.createElement('div');
                    div.className = 'comment-preview-item';
                    div.dataset.index = pendingCommentImages.length - 1;
                    div.innerHTML = `<img src="${dataUrl}" alt="preview"><span class="remove-btn" onclick="removeCommentPreview(this)">✕</span>`;
                    previewContainer.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        }

        window.removeCommentPreview = function(btn) {
            const item = btn.parentElement;
            const index = parseInt(item.dataset.index);
            pendingCommentImages.splice(index, 1);
            item.remove();
            // 重新编号
            document.querySelectorAll('.comment-preview-item').forEach((el, i) => {
                el.dataset.index = i;
            });
        };

        function submitComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text && pendingCommentImages.length === 0) return;

            const comments = JSON.parse(localStorage.getItem('stellar_comments') || '{}');
            const outfitComments = comments[currentOutfitId] || [];

            const comment = {
                id: Date.now(),
                text: text,
                images: [...pendingCommentImages],
                time: new Date().toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
                avatar: ['✦', '✧', '★', '☆', '◆', '◇'][Math.floor(Math.random() * 6)],
                nickname: localStorage.getItem('stellar_username') || `旅行者${Math.floor(Math.random() * 9000) + 1000}`
            };

            outfitComments.unshift(comment);
            comments[currentOutfitId] = outfitComments;
            localStorage.setItem('stellar_comments', JSON.stringify(comments));

            input.value = '';
            pendingCommentImages = [];
            document.getElementById('commentPreviewImages').innerHTML = '';

            renderCommentList(outfitComments);
        }

        function renderCommentList(comments) {
            const list = document.getElementById('commentList');
            if (!comments || comments.length === 0) {
                list.innerHTML = '<div class="comment-empty">暂无评论，来抢沙发吧~</div>';
                return;
            }
            list.innerHTML = comments.map((c, idx) => `
                <div class="comment-item">
                    <div class="comment-user">
                        <div class="comment-avatar">${c.avatar}</div>
                        <span class="comment-nickname">${c.nickname}</span>
                        <span class="comment-time">${c.time}</span>
                        <button class="comment-delete-btn" onclick="deleteComment(${c.id})" title="删除评论">✕</button>
                    </div>
                    ${c.text ? `<div class="comment-text">${escapeHtml(c.text)}</div>` : ''}
                    ${c.images && c.images.length > 0 ? `<div class="comment-images">${c.images.map(img => `<img src="${img}" alt="评论图片" onclick="openCommentImage(this.src)">`).join('')}</div>` : ''}
                </div>
            `).join('');
        }

        window.openCommentImage = function(src) {
            openFullSizeImage(src, '评论图片');
        };

        window.deleteComment = function(id) {
            const comments = JSON.parse(localStorage.getItem('stellar_comments') || '{}');
            const outfitComments = comments[currentOutfitId] || [];
            const filtered = outfitComments.filter(c => c.id !== id);
            comments[currentOutfitId] = filtered;
            localStorage.setItem('stellar_comments', JSON.stringify(comments));
            renderCommentList(filtered);
        };

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function openModal(outfit, clickedImage, label) {
            currentOutfitId = outfit.id;
            const rarityClass = `rarity-${outfit.rarity}`;

            document.getElementById('modalRarityBadge').textContent = outfit.rarityLabel;
            document.getElementById('modalRarityBadge').className = `modal-rarity-badge ${rarityClass}`;
            document.getElementById('modalVersionBadge').textContent = outfit.version;
            document.getElementById('modalTitle').textContent = outfit.name;
            document.getElementById('modalStars').textContent = '★'.repeat(outfit.stars);

            // 根据label选择对应的描述
            let modalDesc = outfit.modalDesc || outfit.desc;
            if (label === '女' && outfit.modalDescLabel女) {
                modalDesc = outfit.modalDescLabel女;
            } else if (label === '男' && outfit.modalDescLabel男) {
                modalDesc = outfit.modalDescLabel男;
            }
            document.getElementById('modalDesc').textContent = modalDesc;
            document.getElementById('modalObtainDetail').textContent = outfit.obtainDetail;

            const priceEl = document.getElementById('modalPrice');
            priceEl.textContent = outfit.price;
            priceEl.className = outfit.isFree ? 'modal-price-value free' : 'modal-price-value';

            document.getElementById('modalObtainMethod').innerHTML = '';

            // 设置背景图片
            const modalImg = document.getElementById('modalImg');
            const modalPlaceholder = document.getElementById('modalPlaceholder');
            const modalZoomHint = document.getElementById('modalZoomHint');

            const displayImage = clickedImage || outfit.image;
            if (displayImage) {
                modalImg.src = displayImage;
                modalImg.alt = outfit.name;
                modalImg.style.display = 'block';
                modalPlaceholder.style.display = 'none';
                modalZoomHint.style.display = 'block';
            } else {
                modalImg.style.display = 'none';
                modalPlaceholder.style.display = 'block';
                modalZoomHint.style.display = 'none';
            }

            // 重置评论区
            document.getElementById('commentInput').value = '';
            pendingCommentImages = [];
            document.getElementById('commentPreviewImages').innerHTML = '';

            // 加载评论
            const comments = JSON.parse(localStorage.getItem('stellar_comments') || '{}');
            const outfitComments = comments[currentOutfitId] || [];
            renderCommentList(outfitComments);

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Full size image viewer
        function openFullSizeImage(imageSrc, outfitName) {
            const fullOverlay = document.createElement('div');
            fullOverlay.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: zoom-out;';
            fullOverlay.innerHTML = `
                <img src="${imageSrc}" alt="${outfitName}" style="max-width: 95%; max-height: 90%; object-fit: contain;">
                <div style="position: absolute; top: 20px; right: 20px; color: white; font-size: 2em; cursor: pointer;" onclick="this.parentElement.remove()">✕</div>
                <div style="position: absolute; bottom: 20px; color: rgba(255,255,255,0.7); font-size: 1em;">${outfitName}</div>
            `;
            fullOverlay.addEventListener('click', (e) => {
                if (e.target === fullOverlay) fullOverlay.remove();
            });
            document.body.appendChild(fullOverlay);
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 注册弹窗逻辑
        const welcomeOverlay = document.getElementById('welcomeOverlay');
        const welcomeInput = document.getElementById('welcomeInput');
        const welcomeBtn = document.getElementById('welcomeBtn');
        const welcomeError = document.getElementById('welcomeError');

        function isValidName(name) {
            // 至少2个中文 或者 至少1个英文单词（不含空格）
            const cn = name.match(/^[\u4e00-\u9fa5]{2,}$/);
            const en = name.match(/^[a-zA-Z]+\s?[a-zA-Z]*$/);
            return cn || en;
        }

        function submitWelcome() {
            const name = welcomeInput.value.trim();
            if (!isValidName(name)) {
                welcomeError.textContent = '名字无效：至少2个中文或1个英文单词';
                return;
            }
            localStorage.setItem('stellar_username', name);
            welcomeOverlay.style.display = 'none';
            document.getElementById('userIdBadge').textContent = '旅行者 · ' + name;
        }

        welcomeBtn.addEventListener('click', submitWelcome);
        welcomeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitWelcome();
        });

        // 若已注册过，直接隐藏并显示ID
        if (localStorage.getItem('stellar_username')) {
            welcomeOverlay.style.display = 'none';
            document.getElementById('userIdBadge').textContent = '旅行者 · ' + localStorage.getItem('stellar_username');
        }

        // 打开弹窗时聚焦输入框
        welcomeInput.focus();
    </script>
</body>
</html>
